# File: deploy/pro-teches.com.conf → /etc/nginx/sites-available/pro-teches.com
#
# nginx บน host ของ VM: ถือ TLS ของ pro-teches.com แล้วส่งต่อเข้า container ที่
# 127.0.0.1:8081 (docker-compose.yml) — container ไม่ได้เปิดออกเน็ตเอง
#
# VM ตัวนี้มีหลายเว็บอยู่ แยกกันด้วย server_name ล้วน ๆ ไฟล์นี้แตะเฉพาะ pro-teches.com
# ไม่ต้องไปยุ่งกับไฟล์ของเว็บอื่น และ Host ที่ไม่ตรงเว็บไหนเลยมีบล็อก default_server
# ใน sites-available/default รับไว้ (return 444) อยู่แล้ว

server {
    listen 80;
    listen [::]:80;
    server_name www.pro-teches.com;
    return 301 http://pro-teches.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pro-teches.com;
    ssl_certificate     /etc/ssl/cloudflare/pro-teches.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pro-teches.com.key;
    return 301 https://pro-teches.com$request_uri;
}

# พอร์ต 80 ยังเสิร์ฟเว็บตามปกติ ไม่ redirect ไป https เอง
# เพราะ Origin Certificate เบราว์เซอร์ไม่รู้จัก ถ้า redirect แล้วเมฆยังเทา
# ผู้ใช้จะเจอหน้าเตือน certificate ปล่อยให้ Always Use HTTPS ของ Cloudflare
# จัดการ redirect ที่ขอบแทน ปลอดภัยกว่าและไม่มีช่วงที่เว็บพัง
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pro-teches.com;

    ssl_certificate     /etc/ssl/cloudflare/pro-teches.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pro-teches.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/pro-teches.com.access.log;
    error_log  /var/log/nginx/pro-teches.com.error.log;

    # แคช/หมดอายุ/ชนิดไฟล์ ให้ nginx ใน container ตัดสินทั้งหมด (default.conf)
    # ตรงนี้ทำหน้าที่เดียวคือส่งต่อ จะได้ไม่มีกฎสองชุดที่ขัดกันเอง
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
