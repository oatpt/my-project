# File: default.conf → /etc/nginx/conf.d/default.conf ใน container
#
# nginx ใน container เสิร์ฟไฟล์ที่ vite build ไว้ ไม่มี TLS ตรงนี้
# ตัวที่รับ https ของ pro-teches.com คือ nginx บน host (ดู deploy/pro-teches.com.conf)
# แล้ว proxy เข้ามาที่ 127.0.0.1:8081 ซึ่งชนกับพอร์ต 80 ในนี้

server {
    listen 80;
    server_name _;

    # ตั้งให้ root เป็นตำแหน่งไฟล์ build (dist) ของคุณ
    root /usr/share/nginx/html;
    index index.html;

    # ให้ log เห็น IP ที่ nginx บน host ส่งมาให้ ไม่ใช่ IP ของ gateway ใน docker network
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    # ไฟล์แนบของสินค้า: ถ้าไม่มีไฟล์จริงต้องเป็น 404
    # ไม่งั้นจะตกไป fallback ของ SPA แล้วดาวน์โหลดได้ index.html ที่ตั้งชื่อเป็น .pdf
    # ต้องเป็น ^~ ไม่ใช่ /files/ เฉย ๆ เพราะ location แบบ regex ชนะ prefix เสมอ
    # ถ้าวันหลังมีใครเพิ่ม location ~* \.pdf$ เข้ามา บล็อกนี้จะโดนแย่งไปทันที
    location ^~ /files/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ไฟล์ที่ vite ใส่ hash ไว้ในชื่อ (index-BIKW4y1r.css) เนื้อเปลี่ยนเมื่อไหร่ชื่อเปลี่ยนตาม
    # จึงแคชได้ยาวเต็มที่ ไม่ต้องกลัวผู้ใช้ค้างอยู่กับของเก่า
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # react-router แบบ BrowserRouter — /pricing, /product-details/<id> ไม่มีไฟล์จริงบนดิสก์
    # path ไหนไม่ตรงไฟล์ต้องคืน index.html ไปให้ฝั่งเบราว์เซอร์เลือก route เอง
    # index.html ห้ามแคช ไม่งั้นผู้ใช้จะอ้างถึงไฟล์ /assets/ รุ่นที่ถูก build ทับไปแล้ว
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
